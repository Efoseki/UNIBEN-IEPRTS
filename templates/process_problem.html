{% extends 'base.html' %} {% load static %} {% block home_content %}


<!-- Begin Page Content -->
<!-- <div class="container-fluid bg-white">  -->
<div class="container">


    <div>
        <div class="card-body p-0">
            <!-- Nested Row within Card Body -->
            <div class="row justify-content-center">
                <!-- <div class="col-lg-5 d-none d-lg-block bg-register-image"></div> -->
                <div class="col-lg-7  border-dark border border-3" style="background-color: lightblue; margin-top: 10px; margin-bottom: 10px;">
                    <div class="p-5">
                        <div class="text-center">
                            <h1 class="h4 mb-4" style="color: black">PROCESS A REPORTED PROBLEM </h1>
                        </div>
                        <form class="user" method="POST" enctype="multipart/form-data">

                            <div class="form-group row">
                                <div class="col-sm-6 mb-3 mb-sm-0">
                                    <input type="text" class="form-control" name="problem_id" id="problem_id" placeholder="Problem ID">
                                </div>
                                <div class="col-sm-6">
                                    <input type="submit" value="Search" class="btn btn-dark btn-block">
                                </div>
                            </div>

                            <div>
                                <div col>
                                    <hr style="height:1px; background-color: gray; margin-top: 30px; margin-bottom: 30px ">
                                </div>
                            </div>

                            <div class="form-group row">
                                <div class="col-sm-6 mb-3 mb-sm-0">
                                    <label for="date_reported" style="color:black"> Date Reported </label>
                                    <input type="text " class="form-control " name="date_reported " id="date_reported" placeholder="" disabled>
                                </div>
                                <div class="col-sm-6 ">
                                    <label for="problem_status" style="color:black"> Problem Status </label>
                                    <input type="text " class="form-control" name="problem_status" id="problem_status" placeholder="" disabled>
                                </div>
                            </div>

                            <div class="form-group row ">
                                <div class="col-sm-6 mb-3 mb-sm-0 ">
                                    <select class="form-control " name="category ">
											<option value  =" " disabled selected hidden> Choose New Status </option>e
											<option value  ="pending"> Pending </option>
											<option value  ="receiving attention"> Receiving Attention </option>
                                            <option value  ="resolved"> Resolved </option>
                                            <option value  ="closed"> Closed </option>
										</select>
                                </div>

                                <div class="col-sm-6 mb-3 mb-sm-0">
                                    <input type="text" class="form-control" name="officer_name" id="officer_name" placeholder="Officer's Name">
                                </div>

                            </div>



                            <div class="form-group row">
                                <div class="col-sm-6 mb-3 mb-sm-0">
                                    <input type="text " class="form-control " name="officer_department" id="officer_department" placeholder="Officer's Department">
                                </div>
                                <div class="col-sm-6 ">
                                    <input type="text " class="form-control " name="officer_phone" id="officer_phone" placeholder="Officer's Phone">
                                </div>
                            </div>


                            <div class="form-group row ">
                                <textarea class="form-control " style="margin: 10px " name="solution" name="solution" placeholder="Detailed description of the Action(s) taken or Solution provided"></textarea>
                            </div>

                            <div class="form-group row ">
                                <input type="submit" value="Submit " class="btn btn-primary btn-user btn-block ">

                                <input type="reset" value="Reset " class="btn btn-google btn-user btn-block ">
                            </div>
                        </form>

                        <br> <br>


                        <form>

                            <!-- <div class="text-center"> -->
                            <div>
                                <h1 class="h4 mb-4 " style="color: black ">Problem Reported:</h1>
                            </div>

                            <!-- <form class="user " method="POST " enctype="multipart/form-data "> -->


                            <div class="form-group row ">
                                <div class="col-sm-6 mb-3 mb-sm-0">
                                    <input type="text" class="form-control" value="Date:" disabled>
                                </div>
                            </div>


                            <div class="form-group row">
                                <div class="col-sm-6 mb-3 mb-sm-0">
                                    <label for="category" style="color:black"> Problem Category </label>
                                    <input type="text" class="form-control" name="category" id="category" placeholder="" disabled>
                                </div>

                                <div class="col-sm-6 mb-3 mb-sm-0">
                                    <label for="subcategory" style="color:black"> Problem Sub Category </label>
                                    <input type="text" class="form-control" name="subcategory" id="subcategory" placeholder="" disabled>
                                </div>

                            </div>



                            <div class="form-group row">
                                <div class="col-sm-6 mb-3 mb-sm-0">
                                    <label for="severity" style="color:black"> Severity </label>
                                    <input type="text" class="form-control" name="severity" id="severity" placeholder="" disabled>
                                </div>
                                <div class="col-sm-6 mb-3 mb-sm-0">
                                    <label for="location" style="color:black"> Problem Location </label>
                                    <input type="text" class="form-control" name="location" id="location" placeholder="" disabled>
                                </div>
                            </div>


                            <div class="form-group row">
                                <label for="description" style="color:black;"> Problem Description </label>
                                <textarea class="form-control" id="description" name="description" placeholder="" disabled></textarea>
                            </div>


                        </form>



                        <!-- Show Picture Here -->

                        <div>
                            <p style="color:black;">Uploaded Image </p>

                            <img src="" alt="No photograph was uploaded" align="center" id="image_file" name="image_file" />
                        </div>


                        <br/> <br/>

                        <form>

                            <!-- <div class="text-center"> -->
                            <div>
                                <h1 class="h4 mb-4 " style="color: black "> Reporter's Details: </h1>
                            </div>



                            <div class="form-group row ">
                                <div class="col-sm-6 mb-3 mb-sm-0 ">
                                    <label for="reporter_cat" style="color:black"> Reporter's Category </label>
                                    <input type="text " class="form-control" name="reporter_cat" placeholder="" disabled/>

                                </div>

                                <div class="col-sm-6 ">
                                    <label for="reporter_dept" style="color:black"> Reporter's Department </label>
                                    <input type="text" class="form-control" id="reporter_dept" name="reporter_email" placeholder="" disabled>
                                </div>
                            </div>


                            <div class="form-group">
                                <label for="reporter_name" style="color:black"> Reporter's Name </label>
                                <input type="text" class="form-control" id="reporter_name" name="reporter_name" placeholder="" disabled>
                            </div>


                            <div class="form-group row">
                                <div class="col-sm-6 mb-3 mb-sm-0">
                                    <label for="reporter_email" style="color:black"> Reporter's Email </label>
                                    <input type="email" class="form-control" id="reporter_email" name="reporter_email" placeholder="" disabled>
                                </div>
                                <div class="col-sm-6 ">
                                    <label for="reporter_phone" style="color:black"> Reporter's Phone </label>
                                    <input type="text" class="form-control" id="phone" name="phone" placeholder="" disabled>
                                </div>
                            </div>


                        </form>


                    </div>
                </div>
            </div>
        </div>
    </div>


</div>
<!-- /.container-fluid -->


{% endblock %}
