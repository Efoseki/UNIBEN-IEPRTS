{% extends 'base.html' %}
{% block title %}Login | UNIBEN IEPRTS{% endblock %}
{% block content %}<div class="container py-5"><div class="row justify-content-center"><div class="col-md-6 col-lg-5"><div class="card p-4 p-md-5"><div class="text-center mb-4"><div class="feature-icon mx-auto mb-3"><i class="fa-solid fa-building-circle-exclamation"></i></div><h2 class="section-title">Sign in</h2><p class="text-muted">Access the UNIBEN Infrastructure and Environmental Problem Reporting and Tracking System.</p></div><form method="post">{% csrf_token %}{{ form.non_field_errors }}<div class="mb-3"><label class="form-label">Username</label><input type="text" name="username" autofocus required class="form-control"></div><div class="mb-4"><label class="form-label">Password</label><input type="password" name="password" required class="form-control"></div><button class="btn btn-uniben w-100 py-2">Sign in</button></form><div class="text-center mt-3 small">No account? <a href="{% url 'register' %}">Create one</a></div></div></div></div></div>{% endblock %}
